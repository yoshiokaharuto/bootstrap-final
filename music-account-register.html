<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - LiveHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="icon" href="./img/favicon.png">
    <link rel="stylesheet" href="./css/music-account-register.css">
</head>
<body>
    <!-- 戻るリンク -->
    <a href="index.html" class="back-link">
        <i class="bi bi-arrow-left-circle"></i> ホームに戻る
    </a>

    <div class="signup-container">
        <div class="signup-card">
            <!-- 登録ヘッダー -->
            <div class="signup-header">
                <div class="signup-icon">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h2 class="fw-bold mb-2">LiveHub</h2>
                <p class="mb-0">新しいアカウントを作成</p>
            </div>

            <!-- 登録フォーム -->
            <div class="signup-body">
                <form id="signupForm">
                    <!-- ユーザー名 -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">
                            ユーザー名
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control form-control-lg" id="username" placeholder="山田太郎" required>
                        </div>
                    </div>

                    <!-- メールアドレス -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">
                            メールアドレス
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control form-control-lg" id="email" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <!-- パスワード -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">
                            パスワード
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="8文字以上" required>
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                        </div>
                        <small class="text-muted" id="strengthText"></small>
                    </div>

                    <!-- パスワード確認 -->
                    <div class="mb-3">
                        <label for="passwordConfirm" class="form-label fw-bold">
                            パスワード確認
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" class="form-control form-control-lg" id="passwordConfirm" placeholder="もう一度入力" required>
                        </div>
                    </div>

                    <!-- 利用規約 -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label" for="terms">
                                <a href="#" class="text-decoration-none" style="color: var(--primary-color);">利用規約</a>と
                                <a href="#" class="text-decoration-none" style="color: var(--primary-color);">プライバシーポリシー</a>に同意します
                            </label>
                        </div>
                    </div>

                    <!-- 登録ボタン -->
                    <button type="submit" class="btn btn-signup w-100 mb-3">
                        <i class="bi bi-check-circle"></i> アカウントを作成
                    </button>

                    <!-- アラート -->
                    <div class="alert alert-danger d-none" role="alert" id="errorAlert">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span id="errorMessage"></span>
                    </div>
                    <div class="alert alert-success d-none" role="alert" id="successAlert">
                        <i class="bi bi-check-circle-fill"></i> アカウントの作成に成功しました!
                    </div>
                </form>

                <div class="text-center">
                    <p class="text-muted mb-0">
                        すでにアカウントをお持ちの方は
                        <a href="music-login-page.html" class="text-decoration-none fw-bold" style="color: var(--primary-color);">ログイン</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- 追加情報 -->
        <div class="text-center mt-4 text-white">
            <p class="mb-2">
                <a href="#" class="text-white text-decoration-none">利用規約</a> ・ 
                <a href="#" class="text-white text-decoration-none">プライバシーポリシー</a>
            </p>
            <p class="small">&copy; 2024 LiveHub. All rights reserved.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // パスワード強度チェック
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            
            if (password.length === 0) {
                strengthText.textContent = '';
            } else if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = '弱いパスワード';
                strengthText.style.color = '#ef4444';
            } else if (strength === 3) {
                strengthBar.classList.add('strength-medium');
                strengthText.textContent = '普通のパスワード';
                strengthText.style.color = '#f59e0b';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = '強いパスワード';
                strengthText.style.color = '#10b981';
            }
        });

        // 登録フォーム送信時の処理
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const terms = document.getElementById('terms').checked;
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const errorMessage = document.getElementById('errorMessage');
            
            // エラーメッセージをリセット
            errorAlert.classList.add('d-none');
            successAlert.classList.add('d-none');
            
            // バリデーション
            if (!username || !email || !password || !passwordConfirm) {
                errorMessage.textContent = 'すべての項目を入力してください';
                errorAlert.classList.remove('d-none');
                return;
            }
            
            if (password.length < 8) {
                errorMessage.textContent = 'パスワードは8文字以上で入力してください';
                errorAlert.classList.remove('d-none');
                return;
            }
            
            if (password !== passwordConfirm) {
                errorMessage.textContent = 'パスワードが一致しません';
                errorAlert.classList.remove('d-none');
                return;
            }
            
            if (!terms) {
                errorMessage.textContent = '利用規約に同意してください';
                errorAlert.classList.remove('d-none');
                return;
            }
            
            // 成功時の処理
            successAlert.classList.remove('d-none');
            setTimeout(function() {
                alert('登録が完了しました!ログインページに移動します。');
                // window.location.href = 'login.html';
            }, 1000);
        });

        // エラーメッセージの自動非表示
        const inputs = ['username', 'email', 'password', 'passwordConfirm'];
        inputs.forEach(function(id) {
            document.getElementById(id).addEventListener('input', function() {
                document.getElementById('errorAlert').classList.add('d-none');
            });
        });
        
        document.getElementById('terms').addEventListener('change', function() {
            document.getElementById('errorAlert').classList.add('d-none');
        });
    </script>
</body>
</html>
